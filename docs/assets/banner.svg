<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="exinder">
  <!-- Banner in the style of the brat cover: flat green, black text, slightly blurred. -->
  <defs>
    <filter id="blur" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="1280" height="360" fill="#8ACE00"/>
  <g filter="url(#blur)" fill="#000">
    <text x="640" y="228" text-anchor="middle" transform="translate(640 0) scale(0.82 1) translate(-640 0)"
          font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="190" letter-spacing="-6">exinder</text>
  </g>
  <text x="640" y="300" text-anchor="middle" fill="#000" fill-opacity="0.72"
        font-family="'Arial Narrow', Arial, Helvetica, sans-serif" font-size="30">gallery cleanup, one swipe at a time</text>
</svg>
